name: Boat Watch

on:
  workflow_dispatch:
    inputs:
      new_watch:
        description: "JSON of a newly added watch (optional, triggers a confirmation text)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEW_WATCH: ${{ github.event.inputs.new_watch }}
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "boat-watch-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "Update watch state [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
